<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바다거북스프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EDE9; --surface:#F6F8F5; --ink:#15302F; --muted:#5B716E; --ink-2:#2B4643; --line:#C7D5CF;
  --broth:#B9832A; --broth-soft:#EAD9B4;
  --yes:#2F7A57; --no:#B04A3C; --irr:#7C8B88; --key:#B9832A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1F22; --surface:#142A2D; --ink:#E4EDE9; --muted:#8EA5A1; --ink-2:#C6D6D2; --line:#26413F;
    --broth:#E1AD50; --broth-soft:#3A3322;
    --yes:#62B88C; --no:#E07C6B; --irr:#8C9B98; --key:#E1AD50;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1F22; --surface:#142A2D; --ink:#E4EDE9; --muted:#8EA5A1; --ink-2:#C6D6D2; --line:#26413F;
  --broth:#E1AD50; --broth-soft:#3A3322;
  --yes:#62B88C; --no:#E07C6B; --irr:#8C9B98; --key:#E1AD50;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px 48px}
.serif{font-family:"Gowun Batang","Nanum Myeongjo",Georgia,serif}

/* ---------- menu ---------- */
.masthead{display:flex;align-items:center;gap:18px;margin:8px 0 28px}
.masthead svg{flex:none}
.masthead h1{font-family:"Gowun Batang",Georgia,serif;font-size:2.4rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.masthead p{margin:6px 0 0;color:var(--ink-2);font-size:1rem}
.rules{background:var(--surface);border-left:3px solid var(--broth);padding:16px 20px;margin:0 0 32px;font-size:1rem;color:var(--ink-2)}
.rules b{color:var(--ink);font-weight:700}
.menu{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.menu button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:4px 16px;width:100%;padding:14px 12px;border-radius:6px;cursor:pointer;transition:background-color .15s}
.menu button:hover{background:var(--surface)}
@media (max-width:520px){.menu button{grid-template-columns:80px minmax(0,1fr) auto;gap:4px 12px}}
.m-thumb{grid-column:1;grid-row:1/span 2;align-self:center;aspect-ratio:16/9;border-radius:4px;overflow:hidden}
.m-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.m-title{grid-column:2;grid-row:1}
.m-level,.m-done{grid-column:3;grid-row:1}
.menu button:focus-visible{outline:2px solid var(--broth);outline-offset:-2px}
.menu button:hover .m-title{color:var(--broth)}
.m-title{font-family:"Gowun Batang",Georgia,serif;font-size:1.25rem;font-weight:700}
.m-level{color:var(--muted);font-size:.85rem;align-self:center}
.m-soup{grid-column:2/-1;grid-row:2;color:var(--ink-2);font-size:.97rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-done{color:var(--yes);font-size:.85rem}

/* ---------- game ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.link{background:none;border:none;padding:6px 0;color:var(--muted);font-size:.95rem}
.link:hover{color:var(--ink)}
.stage{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;margin:8px 0 24px}
@media (max-width:520px){.stage{grid-template-columns:96px 1fr;gap:16px}}
.bowl{width:100%;height:auto;display:block}
.bowl .surface{fill:var(--broth-soft);transition:fill .5s}
.bowl .rim{fill:none;stroke:var(--ink);stroke-width:3}
.bowl .count{fill:var(--ink);font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:34px;text-anchor:middle}
.bowl .countlabel{fill:var(--muted);font-size:11px;text-anchor:middle;font-family:"Noto Sans KR",sans-serif}
.ripple{fill:none;stroke:var(--broth);stroke-width:2;opacity:0}
.ripple.go{animation:rip 1.1s ease-out}
@keyframes rip{from{r:12;opacity:.9}to{r:58;opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple.go{animation:none}}
.title{font-family:"Gowun Batang",Georgia,serif;font-size:1.7rem;margin:0 0 6px;line-height:1.25}
.level{color:var(--muted);font-size:.88rem}
.soup{font-family:"Gowun Batang",Georgia,serif;font-size:1.2rem;line-height:1.85;margin:0 0 28px;padding:20px 22px;background:var(--surface);border-radius:4px}

.log{list-style:none;margin:0 0 20px;padding:0}
.log li{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:12px 0;align-items:baseline}
.log li+li{margin-top:2px}
.log .q{word-break:keep-all;overflow-wrap:anywhere}
.log .a{font-weight:700;white-space:nowrap}
.log .c{grid-column:1/-1;color:var(--ink-2);font-size:.95rem}
.a.yes{color:var(--yes)} .a.no{color:var(--no)} .a.irrelevant{color:var(--irr)} .a.key{color:var(--key)} .a.invalid{color:var(--muted);font-weight:500} .a.pending{color:var(--muted);font-weight:400}
.log li.hint{background:var(--surface);padding:12px 14px;border-radius:4px}
.log li.hint .q{color:var(--ink-2)}
.empty{color:var(--muted);font-size:.95rem;margin:0 0 20px}

.ask{display:flex;gap:8px;position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.ask input{flex:1;min-width:0;padding:12px 14px;background:var(--surface);border:0;border-radius:4px}
.ask input::placeholder{color:var(--muted)}
.btn{padding:12px 18px;border-radius:4px;border:0;background:var(--ink);color:var(--bg);font-weight:500;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--broth-soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.notice{color:var(--no);font-size:.92rem;margin:8px 0 0}

.reveal{margin-top:28px;padding:22px;border:2px solid var(--broth);border-radius:4px;background:var(--surface)}
.reveal h3{font-family:"Gowun Batang",Georgia,serif;margin:0 0 10px;font-size:1.3rem}
.reveal p{font-family:"Gowun Batang",Georgia,serif;margin:0;line-height:1.85}
.reveal .stat{font-family:"Noto Sans KR",sans-serif;color:var(--muted);font-size:.9rem;margin-top:12px}
.ill{margin:0 0 16px;border-radius:4px;overflow:hidden;aspect-ratio:16/9}
.ill img{display:block;width:100%;height:100%;object-fit:cover}
.hostbar{margin:-12px 0 24px;padding:14px 18px;background:var(--broth-soft);border-radius:4px;font-size:.95rem;color:var(--ink-2)}
.hostbar b{color:var(--ink);font-weight:700}
.hostbar .btn{margin-top:10px;padding:8px 12px;font-size:.92rem;background:var(--bg)}
.truthbox{margin-top:12px;padding:12px 14px;background:var(--surface);border-left:3px solid var(--broth);font-family:"Gowun Batang",Georgia,serif;color:var(--ink);line-height:1.8}
.truthbox ul{margin:8px 0 0;padding-left:18px;font-family:"Noto Sans KR",sans-serif;font-size:.92rem;color:var(--ink-2)}
.judge{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px;padding:12px;border-radius:4px;background:var(--surface)}
.judge span{width:100%;font-size:.92rem;color:var(--ink-2)}
.judge button{padding:8px 14px;border-radius:4px;border:0;background:var(--bg);font-weight:700}
.judge button:hover{background:var(--broth-soft)}
.judge button.yes{color:var(--yes)}
.judge button.no{color:var(--no)}
.judge button.key{color:var(--key)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <section id="menuView">
    <header class="masthead">
      <svg width="72" height="72" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="54" fill="var(--broth-soft)" stroke="var(--ink)" stroke-width="3"/>
        <path d="M60 38c11 0 19 8 19 19s-8 19-19 19-19-8-19-19 8-19 19-19z" fill="none" stroke="var(--broth)" stroke-width="3"/>
        <path d="M60 38v38M43 50l34 14M77 50L43 64" stroke="var(--broth)" stroke-width="2" opacity=".6"/>
        <circle cx="60" cy="31" r="6" fill="var(--broth)"/>
        <path d="M42 48l-8-6M78 48l8-6M44 70l-8 6M76 70l8 6" stroke="var(--broth)" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>바다거북스프</h1>
        <p>이상한 이야기의 진상을 예/아니오 질문만으로 밝혀내세요.</p>
      </div>
    </header>
    <div class="rules">
      질문을 하면 AI가 (AI를 쓸 수 없을 때는 출제자가) <b>예</b>, <b>아니오</b>, <b>상관없음</b> 중 하나로 답해요.
      진상의 핵심을 짚는 질문에는 <b>핵심에 가까워요</b>라고 알려줍니다.
      진상을 알 것 같으면 문장으로 써서 제출하세요.
    </div>
    <ul class="menu" id="menu"></ul>
  </section>

  <section id="gameView" hidden>
    <div class="topbar">
      <button class="link" id="backBtn">← 문제 목록</button>
      <span class="level" id="gLevel"></span>
    </div>
    <div class="stage">
      <svg class="bowl" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="surface" id="surface" cx="60" cy="60" r="52"/>
        <circle class="ripple" id="ripple" cx="60" cy="60" r="12"/>
        <circle class="rim" cx="60" cy="60" r="56"/>
        <text class="count" id="count" x="60" y="66">0</text>
        <text class="countlabel" x="60" y="84">질문</text>
      </svg>
      <div>
        <h2 class="title" id="gTitle"></h2>
        <span class="level" id="gStatus"></span>
      </div>
    </div>
    <div class="ill" id="gIll" aria-hidden="true"></div>
    <p class="soup" id="gSoup"></p>
    <div class="hostbar" id="hostbar" hidden>
      <b>출제자 모드</b> · 이 화면에선 AI 판정을 쓸 수 없어서, 한 명이 출제자가 되어 진상을 몰래 보고 질문마다 버튼으로 답해 주세요.
      <div><button class="btn ghost" id="truthBtn" type="button">진상 보기 (출제자만)</button></div>
      <div class="truthbox" id="truthBox" hidden></div>
    </div>

    <p class="empty" id="emptyLog">첫 질문을 던져보세요. 예: "남자는 그 사람을 알고 있었나요?"</p>
    <ul class="log" id="log" aria-live="polite"></ul>
    <div class="judge" id="judge" hidden></div>

    <div id="playArea">
      <form class="ask" id="askForm" onsubmit="return false">
        <input id="qInput" maxlength="200" autocomplete="off" placeholder="예/아니오로 답할 수 있는 질문" aria-label="질문 입력">
        <button class="btn" id="askBtn" type="button">질문하기</button>
      </form>
      <div class="tools">
        <button class="btn ghost" id="guessBtn" type="button">진상 제출</button>
        <button class="btn ghost" id="hintBtn" type="button">힌트 (3)</button>
        <button class="btn ghost" id="giveupBtn" type="button">포기하고 진상 보기</button>
      </div>
      <p class="notice" id="notice" hidden></p>
    </div>

    <div class="reveal" id="reveal" hidden>
      <h3 id="revealTitle">진상</h3>
      <p id="revealText"></p>
      <div class="stat" id="revealStat"></div>
    </div>
  </section>

</div>

<script>
const PUZZLES = [
  {
    id:"cake", img:"img/cake.webp", title:"생일 케이크", level:"쉬움",
    soup:"여자는 생일 케이크의 촛불을 끄고 나서 한참을 펑펑 울었다. 그리고 그날 밤, 몇 년 만에 처음으로 푹 잠들었다.",
  },
  {
    id:"exam", img:"img/exam.webp", title:"손을 든 학생", level:"쉬움",
    soup:"기말고사 도중 한 학생이 손을 들자, 선생님은 시험지를 한 장 넘겨보더니 곧바로 시험을 중단시켰다. 학생은 문제에 대해 아무것도 묻지 않았다.",
  },
  {
    id:"ramen", img:"img/ramen.webp", title:"식어가는 라면", level:"보통",
    soup:"남자는 라면을 끓여 놓고 30분 동안 한 젓가락도 먹지 않은 채 바라보기만 했다. 그리고 젓가락으로 면을 한 가닥 집어 들더니 만족스럽게 웃었다.",
  },
  {
    id:"photo", img:"img/photo.webp", title:"호숫가 사진", level:"보통",
    soup:"여행에서 돌아온 여자는 휴대폰 사진을 넘기다 한 장에서 손을 멈추고, 곧바로 경찰에 전화했다. 그 사진에는 잔잔한 호수 풍경만 담겨 있었다.",
  },
  {
    id:"painting", img:"img/painting.webp", title:"거꾸로 걸린 그림", level:"어려움",
    soup:"미술관 야간 경비원은 한 그림이 거꾸로 걸려 있다는 걸 알아챘지만, 아무에게도 말하지 않고 그대로 두었다. 일주일 뒤, 그는 미술관으로부터 표창을 받았다.",
  },
  {
    id:"lighthouse", img:"img/lighthouse.webp", title:"꺼진 등대", level:"어려움",
    soup:"평생 하룻밤도 거르지 않던 등대지기가 어느 여름밤, 처음으로 등대 불을 켜지 않았다. 다음 날 아침 마을 사람들은 그에게 고맙다며 인사를 건넸다.",
  }
];

const VERDICT = {
  yes:{label:"예"}, no:{label:"아니오"}, irrelevant:{label:"상관없음"},
  key:{label:"예, 핵심에 가까워요"}, invalid:{label:"다시 물어주세요"},
  solved:{label:"정답!"}, wrong:{label:"아직 아니에요"}
};

// ---------- state ----------
let solvedSet = new Set();
try { solvedSet = new Set(JSON.parse(localStorage.getItem("ts-solved")||"[]")); } catch(e) {}
function saveSolved(){ try{ localStorage.setItem("ts-solved", JSON.stringify([...solvedSet])); }catch(e){} }

let cur = null, log = [], qCount = 0, hintsLeft = 3, finished = false, busy = false, mode = "ask";
// ---------- Firebase (AI Logic 서버 프롬프트 템플릿 + Firestore) ----------
// 진상과 핵심 포인트는 이 파일에 없어요. 판정·채점·힌트는 서버 템플릿이, 진상 공개는 Firestore가 맡아요.
// 아래 웹 설정값은 공개돼도 되는 식별자예요. Gemini API 키나 서비스 계정 파일은 절대 넣지 마세요.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCeEXSLC1OMVaRZ2qv8ftF_BCAQ7jqDkz0",
  authDomain: "turtle-soup-7053d.firebaseapp.com",
  projectId: "turtle-soup-7053d",
  storageBucket: "turtle-soup-7053d.firebasestorage.app",
  messagingSenderId: "672924985575",
  appId: "1:672924985575:web:2a8cfd7177de76925d1a42"
};
const RECAPTCHA_ENTERPRISE_SITE_KEY = "6LeJbPotAAAAAGfDxpn2TqgDYjOMIzZO1pBUTWgo";
const TEMPLATES = {judge:"turtle-judge-v1", guess:"turtle-guess-v1", hint:"turtle-hint-v1"};
const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/13.0.0/";
const AI_TIMEOUT_MS = 15000;
const ASK_COOLDOWN_MS = 3000;
const RETRY_429_MS = 5000;
const MAX_INPUT = 200, MAX_HISTORY = 30;

let backendPromise = null, aiOn = true;
function getBackend(){
  if (!backendPromise) backendPromise = initBackend().catch(e=>{ console.warn("Firebase 초기화 실패", e); return null; });
  return backendPromise;
}

async function initBackend(){
  if (!FIREBASE_CONFIG || !RECAPTCHA_ENTERPRISE_SITE_KEY) return null;
  const [{initializeApp}, {initializeAppCheck, ReCaptchaEnterpriseProvider}, {getAI, getTemplateGenerativeModel, GoogleAIBackend}, {getFirestore, doc, getDoc}] =
    await Promise.all(["firebase-app.js","firebase-app-check.js","firebase-ai.js","firebase-firestore-lite.js"].map(f=>import(FIREBASE_SDK + f)));
  const app = initializeApp(FIREBASE_CONFIG);
  // 로컬 개발 때만 디버그 토큰 사용 (콘솔에 찍힌 토큰을 Firebase 콘솔에 등록)
  if (["localhost","127.0.0.1"].includes(location.hostname)) self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
  initializeAppCheck(app, {provider: new ReCaptchaEnterpriseProvider(RECAPTCHA_ENTERPRISE_SITE_KEY), isTokenAutoRefreshEnabled: true});
  const model = getTemplateGenerativeModel(getAI(app, {backend: new GoogleAIBackend()}));
  const db = getFirestore(app);
  const truths = {};
  return {
    async run(templateId, vars){
      const once = async ()=>{
        let timer;
        const timeout = new Promise((_, reject)=>{ timer = setTimeout(()=>reject(new Error("timeout")), AI_TIMEOUT_MS); });
        try { return (await Promise.race([model.generateContent({templateId, templateVariables: vars}), timeout])).response.text(); }
        finally { clearTimeout(timer); }
      };
      // 시간 초과·일시적 서버 오류(5xx)·분당 한도(429)는 한 번만 다시 시도. 429는 몇 초 뒤 풀리므로 기다렸다가
      try { return await once(); }
      catch(e){
        const status = e && e.customErrorData && e.customErrorData.status;
        if (status === 429){ await new Promise(r=>setTimeout(r, RETRY_429_MS)); return once(); }
        if (e && e.message === "timeout" || status >= 500) return once();
        throw e;
      }
    },
    reveal(id){
      if (!truths[id]) truths[id] = getDoc(doc(db, "puzzles", id)).then(s=>{
        const d = s.data();
        if (!d || typeof d.truth !== "string") throw new Error("not-found");
        return {truth: d.truth, keys: Array.isArray(d.keys) ? d.keys.map(String) : []};
      }).catch(e=>{ delete truths[id]; throw e; });
      return truths[id];
    }
  };
}

// 템플릿 변수: 문제 플래그 + 지금까지의 문답 (플레이어 입력은 길이 제한, 구분자 문자 제거)
function clean(s){ return String(s).replace(/[<>{}]/g, " ").slice(0, MAX_INPUT); }
function templateVars(extra){
  const vars = {[cur.id]: true, ...extra};
  const history = log.filter(e=>e.verdict && e.kind !== "hint").slice(-MAX_HISTORY)
    .map(e=>({kind: e.kind === "guess" ? "추측" : "질문", text: clean(e.text), answer: VERDICT[e.verdict].label}));
  if (history.length) vars.history = history;
  return vars;
}
function parseJson(text){ return JSON.parse(String(text).replace(/^\s*```(?:json)?|```\s*$/g, "")); }

// Gemini 호출이 실패하거나 무료 한도를 넘으면 이번 세션은 출제자 모드로 전환
function failReason(err){
  const s = String(err && (err.customErrorData && err.customErrorData.status || "") + " " + (err.message || err.code || ""));
  if (/429|quota|resource.?exhausted/i.test(s)) return "AI 무료 한도를 넘었어요 (잠시 뒤 새로고침하면 다시 AI로 할 수 있어요)";
  if (/timeout/i.test(s)) return "AI 응답이 너무 늦어요";
  if (/403|app.?check|permission/i.test(s)) return "AI 접근이 허용되지 않았어요";
  if (/404|not.?found/i.test(s)) return "AI 판정 설정을 찾지 못했어요";
  return "AI에 연결하지 못했어요";
}
function switchToHost(err){
  console.warn("AI 판정 실패, 출제자 모드로 전환", err);
  hostMode = true; aiOn = false;
  $("hostbar").hidden = false; $("hintBtn").hidden = true;
  showNotice(failReason(err) + " · 출제자 모드로 바꿨어요. 한 명이 '진상 보기'로 정답을 보고 답해 주세요.");
}

const $ = id => document.getElementById(id);

// ---------- menu ----------
function renderMenu(){
  const ul = $("menu"); ul.innerHTML = "";
  PUZZLES.forEach(p=>{
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.innerHTML = `<span class="m-title"></span><span class="${solvedSet.has(p.id)?'m-done':'m-level'}"></span><span class="m-soup"></span><span class="m-thumb" aria-hidden="true"><img src="${p.img}" alt="" loading="lazy" decoding="async" width="1280" height="720"></span>`;
    b.querySelector(".m-title").textContent = p.title;
    b.children[1].textContent = solvedSet.has(p.id) ? "해결함" : p.level;
    b.querySelector(".m-soup").textContent = p.soup;
    b.onclick = ()=>start(p);
    li.appendChild(b); ul.appendChild(li);
  });
}

// ---------- game ----------
function start(p){
  cur = p; log = []; qCount = 0; hintsLeft = 3; finished = false; busy = false; setMode("ask");
  $("gTitle").textContent = p.title;
  $("gLevel").textContent = p.level;
  $("gStatus").textContent = solvedSet.has(p.id) ? "이전에 해결한 문제" : "진행 중";
  $("gSoup").textContent = p.soup;
  $("gIll").innerHTML = `<img src="${p.img}" alt="" decoding="async" width="1280" height="720">`;
  $("hostbar").hidden = !hostMode; $("truthBox").hidden = true; $("truthBtn").textContent = "진상 보기 (출제자만)";
  $("truthBox").innerHTML = ""; delete $("truthBox").dataset.id;
  $("judge").hidden = true; $("hintBtn").hidden = hostMode;
  $("reveal").hidden = true; $("playArea").hidden = false;
  $("notice").hidden = true;
  $("hintBtn").textContent = "힌트 (3)"; $("hintBtn").disabled = false;
  renderLog(); updateCount();
  $("menuView").hidden = true; $("gameView").hidden = false;
  window.scrollTo(0,0);
  $("qInput").focus();
}

function setMode(m){
  mode = m;
  if (m === "guess"){
    $("qInput").placeholder = "진상을 문장으로 써보세요";
    $("askBtn").textContent = "제출하기";
    $("guessBtn").textContent = "질문으로 돌아가기";
  } else {
    $("qInput").placeholder = "예/아니오로 답할 수 있는 질문";
    $("askBtn").textContent = "질문하기";
    $("guessBtn").textContent = "진상 제출";
  }
}

function updateCount(){ $("count").textContent = qCount; }

function renderLog(){
  const ul = $("log"); ul.innerHTML = "";
  $("emptyLog").hidden = log.length > 0;
  log.forEach(e=>{
    const li = document.createElement("li");
    if (e.kind === "hint") li.className = "hint";
    const q = document.createElement("span"); q.className = "q";
    q.textContent = e.kind === "hint" ? "힌트 · " + e.text : (e.kind === "guess" ? "진상 제출: " + e.text : e.text);
    li.appendChild(q);
    if (e.kind !== "hint"){
      const a = document.createElement("span");
      a.className = "a " + (e.verdict || "pending");
      a.textContent = e.verdict ? VERDICT[e.verdict].label : "생각 중…";
      li.appendChild(a);
    }
    if (e.comment){
      const c = document.createElement("span"); c.className = "c"; c.textContent = e.comment; li.appendChild(c);
    }
    ul.appendChild(li);
  });
}

function ripple(verdict){
  const r = $("ripple");
  r.classList.remove("go"); void r.getBoundingClientRect(); r.classList.add("go");
  const col = {yes:"var(--yes)",no:"var(--no)",key:"var(--key)",solved:"var(--yes)"}[verdict];
  r.style.stroke = col || "var(--broth)";
}

let hostMode = false;
function showJudge(entry, isGuess){
  const j = $("judge"); j.innerHTML = "";
  const lab = document.createElement("span"); lab.textContent = isGuess ? "출제자: 진상을 맞혔나요?" : "출제자: 이 질문에 답해 주세요"; j.appendChild(lab);
  const opts = isGuess ? [["solved","정답!","yes"],["wrong","아직 아니에요","no"]]
    : [["yes","예","yes"],["no","아니오","no"],["irrelevant","상관없음",""],["key","예, 핵심이에요","key"],["invalid","다시 물어봐요",""]];
  opts.forEach(([v,label,cls])=>{
    const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (cls) b.className = cls;
    b.onclick = ()=>{
      entry.verdict = v; j.hidden = true; setBusy(false);
      if (v !== "invalid") { qCount++; updateCount(); }
      ripple(v); renderLog();
      if (v === "solved") finish(true); else $("qInput").focus();
    };
    j.appendChild(b);
  });
  setBusy(true); j.hidden = false; j.querySelector("button").focus();
}
// 출제자 모드의 진상 보기: Firestore에서 그때 불러옴
$("truthBtn").onclick = async ()=>{
  const t = $("truthBox");
  if (!t.hidden){ t.hidden = true; $("truthBtn").textContent = "진상 보기 (출제자만)"; return; }
  t.hidden = false; $("truthBtn").textContent = "진상 숨기기";
  if (t.dataset.id === cur.id) return;
  const p = cur; t.textContent = "진상을 불러오는 중…";
  try{
    const backend = await getBackend();
    if (!backend) throw new Error("no-config");
    const {truth, keys} = await backend.reveal(p.id);
    if (cur !== p) return;
    const tp = document.createElement("p"); tp.style.margin = "0"; tp.textContent = truth;
    const ul = document.createElement("ul"); keys.forEach(k=>{ const li = document.createElement("li"); li.textContent = k; ul.appendChild(li); });
    t.replaceChildren(tp, ul); t.dataset.id = p.id;
  }catch(e){
    console.warn("진상 불러오기 실패", e);
    if (cur === p) t.textContent = e.message === "no-config" ? "Firebase 설정이 아직 없어서 진상을 불러올 수 없어요. (README 참고)"
      : "진상을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
  }
};
function showNotice(msg){ const n = $("notice"); n.textContent = msg; n.hidden = !msg; }

let coolUntil = 0;
function setBusy(b){
  busy = b;
  ["askBtn","guessBtn","giveupBtn"].forEach(id=>$(id).disabled = b);
  if (Date.now() < coolUntil) $("askBtn").disabled = true;
  $("hintBtn").disabled = b || hintsLeft <= 0;
}
// 질문 버튼 쿨타임 (요청 수를 줄여 무료 한도 보호)
function startCooldown(){
  coolUntil = Date.now() + ASK_COOLDOWN_MS;
  $("askBtn").disabled = true;
  setTimeout(()=>{ if (!busy) $("askBtn").disabled = false; }, ASK_COOLDOWN_MS);
}

// AI 응답에서 자유 문장은 받지 않고, 화면 문구는 여기서 고정
const PROGRESS_COPY = {none:"아직 핵심과는 거리가 있어요.", partial:"방향은 맞지만 결정적인 이유가 빠졌어요.", close:"거의 다 왔어요! 조금만 더 구체적으로 써 보세요."};
const INVALID_COPY = "예/아니오로 답할 수 있는 질문으로 바꿔 물어보세요.";

async function submit(){
  if (busy || finished || Date.now() < coolUntil) return;
  const text = clean($("qInput").value.trim());
  if (!text.trim()) { $("qInput").focus(); return; }
  const isGuess = mode === "guess";
  const entry = {kind: isGuess ? "guess" : "q", text, verdict:null, comment:""};
  const vars = templateVars(isGuess ? {guess: text} : {question: text});
  log.push(entry); renderLog(); $("qInput").value = "";
  setBusy(true); startCooldown();
  const backend = aiOn && await getBackend();
  if (!backend){ setBusy(false); showJudge(entry, isGuess); return; }

  showNotice("");
  let switched = false;
  try{
    const res = parseJson(await backend.run(isGuess ? TEMPLATES.guess : TEMPLATES.judge, vars));
    let v = String(res && res.verdict || "").trim().toLowerCase();
    const allowed = isGuess ? ["solved","wrong"] : ["yes","no","irrelevant","key","invalid","solved"];
    if (!allowed.includes(v)) v = isGuess ? "wrong" : "invalid";
    entry.verdict = v;
    if (v === "invalid") entry.comment = INVALID_COPY;
    else if (isGuess && v === "wrong") entry.comment = PROGRESS_COPY[String(res.progress).toLowerCase()] || PROGRESS_COPY.none;
    if (v !== "invalid") { qCount++; updateCount(); }
    ripple(v);
    renderLog();
    if (v === "solved") finish(true);
  }catch(e){
    switchToHost(e); switched = true;
  }finally{
    setBusy(false);
    if (switched) showJudge(entry, isGuess);
    else if (!finished) $("qInput").focus();
  }
}

async function hint(){
  if (busy || finished || hintsLeft <= 0) return;
  const backend = aiOn && await getBackend();
  if (!backend){ showNotice("출제자 모드에서는 AI 힌트를 쓸 수 없어요."); return; }
  showNotice("");
  const vars = templateVars({});
  const entry = {kind:"hint", text:"생각 중…"};
  log.push(entry); renderLog();
  setBusy(true);
  try{
    const text = (await backend.run(TEMPLATES.hint, vars)).trim().split("\n")[0].slice(0, 100);
    if (!text) throw new Error("empty hint");
    entry.text = text;
    hintsLeft--;
    $("hintBtn").textContent = `힌트 (${hintsLeft})`;
    renderLog();
  }catch(e){
    log.splice(log.indexOf(entry),1); renderLog();
    switchToHost(e);
  }finally{ setBusy(false); }
}

function finish(won){
  finished = true;
  $("playArea").hidden = true;
  $("reveal").hidden = false;
  $("revealTitle").textContent = won ? "정답이에요! 진상은 이랬어요" : "진상";
  const p = cur;
  $("revealText").textContent = "진상을 불러오는 중…";
  getBackend().then(b=>{ if (!b) throw new Error("no-config"); return b.reveal(p.id); })
    .then(({truth})=>{ if (cur === p) $("revealText").textContent = truth; })
    .catch(e=>{ console.warn("진상 불러오기 실패", e); if (cur === p) $("revealText").textContent = "진상을 불러오지 못했어요. 잠시 후 다시 열어 보세요."; });
  const used = 3 - hintsLeft;
  $("revealStat").textContent = `질문 ${qCount}개` + (used ? `, 힌트 ${used}개` : "") + (won ? "로 해결" : "에서 포기");
  if (won){
    solvedSet.add(cur.id); saveSolved();
    $("gStatus").textContent = "해결함";
    $("surface").style.fill = "var(--broth)";
  }
  $("reveal").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}

$("askBtn").onclick = submit;
$("qInput").addEventListener("keydown", e=>{ if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); submit(); } });
$("guessBtn").onclick = ()=>{ setMode(mode === "guess" ? "ask" : "guess"); $("qInput").focus(); };
$("hintBtn").onclick = hint;
$("giveupBtn").onclick = ()=>{ if (!busy) finish(false); };
$("backBtn").onclick = ()=>{
  $("surface").style.fill = "";
  $("gameView").hidden = true; $("menuView").hidden = false;
  renderMenu(); window.scrollTo(0,0);
};

renderMenu();
getBackend().then(b=>{ hostMode = !b; });
</script>
</body>
</html>
